{
  "openapi": "3.0.3",
  "info": {
    "title": "CS-AS learning platform public API (proposed)",
    "version": "0.5.0",
    "description": "Proposed phase-one learning loop contract. Graph endpoints are phase two. Cookie sessions and CSRF protection are required. Stored in JSON notation, a YAML subset, for standard-library parsing."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "paths": {
    "/api/v1/auth/csrf": {
      "get": {
        "operationId": "getCsrfToken",
        "summary": "Issue CSRF token",
        "responses": {
          "200": {
            "description": "Issue CSRF token",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "token": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "token"
                  ]
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "security": []
      }
    },
    "/api/v1/auth/signup": {
      "post": {
        "operationId": "signup",
        "summary": "Create account without automatic login",
        "responses": {
          "201": {
            "description": "Create account without automatic login",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/User"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "security": [],
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SignupRequest"
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/login": {
      "post": {
        "operationId": "login",
        "summary": "Login and rotate session identifier",
        "responses": {
          "200": {
            "description": "Login and rotate session identifier",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/User"
                }
              }
            },
            "headers": {
              "Set-Cookie": {
                "description": "CSAS_SESSION: Secure; HttpOnly; SameSite=Lax",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "security": [],
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Credentials"
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logout",
        "summary": "Invalidate session and expire cookie",
        "responses": {
          "204": {
            "description": "Invalidate session and expire cookie"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ]
      }
    },
    "/api/v1/auth/me": {
      "get": {
        "operationId": "getCurrentUser",
        "summary": "Get current user",
        "responses": {
          "200": {
            "description": "Get current user",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/User"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/api/v1/quiz/categories": {
      "get": {
        "operationId": "listQuizCategories",
        "summary": "List categories with accessible READY quiz counts",
        "responses": {
          "200": {
            "description": "Category summaries",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/QuizCategorySummary"
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/api/v1/quizzes": {
      "get": {
        "operationId": "listQuizzes",
        "summary": "List accessible READY quizzes without answers",
        "responses": {
          "200": {
            "description": "List accessible READY quizzes without answers",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuizPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "description": "Only accessible READY quizzes. Answer, explanation and evidence are excluded.",
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 50
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/Category"
            }
          },
          {
            "name": "difficulty",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/Difficulty"
            }
          },
          {
            "name": "concept_id",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/api/v1/quizzes/{quiz_id}": {
      "get": {
        "operationId": "getQuiz",
        "summary": "Get quiz without answer or explanation",
        "responses": {
          "200": {
            "description": "Get quiz without answer or explanation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Quiz"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "parameters": [
          {
            "name": "quiz_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/api/v1/quizzes/{quiz_id}/attempts": {
      "post": {
        "operationId": "submitAttempt",
        "summary": "Grade on server and atomically record attempt and review state",
        "responses": {
          "200": {
            "description": "Grade on server and atomically record attempt and review state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AttemptResult"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "description": "Same key and normalized request returns the original result. A new key records a new attempt.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          },
          {
            "name": "quiz_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "selected_option_id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "retry_of_attempt_id": {
                    "type": "string",
                    "format": "uuid"
                  }
                },
                "required": [
                  "selected_option_id"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/api/v1/chat/sessions": {
      "get": {
        "operationId": "listChatSessions",
        "summary": "List owned sessions, newest first",
        "responses": {
          "200": {
            "description": "List owned sessions, newest first",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 20
            }
          }
        ]
      },
      "post": {
        "operationId": "createChatSession",
        "summary": "Create general or attempt-context session",
        "responses": {
          "201": {
            "description": "Create general or attempt-context session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSession"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "description": "Empty object for general chat, or both quiz_id and attempt_id for an owned matching attempt. Context is reconstructed on the server.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string",
                    "maxLength": 200,
                    "nullable": true
                  },
                  "quiz_id": {
                    "type": "string",
                    "format": "uuid",
                    "nullable": true
                  },
                  "attempt_id": {
                    "type": "string",
                    "format": "uuid",
                    "nullable": true
                  }
                },
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/api/v1/chat/sessions/{session_id}": {
      "get": {
        "operationId": "getChatSession",
        "summary": "Get one owned chat session",
        "parameters": [
          {
            "name": "session_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Owned chat session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSession"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/api/v1/chat/sessions/{session_id}/messages": {
      "get": {
        "operationId": "listChatMessages",
        "summary": "Restore owned messages in chronological order",
        "responses": {
          "200": {
            "description": "Restore owned messages in chronological order",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChatMessagePage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "session_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      },
      "post": {
        "operationId": "sendChatMessage",
        "summary": "Answer from retrieved evidence or report insufficient evidence",
        "responses": {
          "200": {
            "description": "Answer from retrieved evidence or report insufficient evidence",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Answer"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "502": {
            "$ref": "#/components/responses/UpstreamFailed"
          },
          "504": {
            "$ref": "#/components/responses/Timeout"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "description": "Server attaches trusted session context. Insufficient evidence means answer=null and sources=[]. Requests are serialized per session. Do not automatically resend; restore messages first.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          },
          {
            "name": "session_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "question": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2000
                  }
                },
                "required": [
                  "question"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/api/v1/quiz-generations": {
      "post": {
        "operationId": "generateRelatedQuiz",
        "summary": "Generate, validate and save one private quiz",
        "responses": {
          "200": {
            "description": "Generate, validate and save one private quiz",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GenerationResult"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "502": {
            "$ref": "#/components/responses/UpstreamFailed"
          },
          "504": {
            "$ref": "#/components/responses/Timeout"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "description": "ready includes a private Quiz. Other statuses return quiz=null. Repeated keys replay stored outcomes; concurrent processing returns 409. Rejected candidates are never exposed.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "concept_ids": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "minItems": 0,
                    "maxItems": 5,
                    "uniqueItems": true,
                    "description": "Registered concept identifiers, from a quiz or the last answer. Must belong to the supplied chat context when that context is present."
                  },
                  "difficulty": {
                    "$ref": "#/components/schemas/Difficulty"
                  },
                  "chat_session_id": {
                    "type": "string",
                    "format": "uuid"
                  }
                },
                "required": [
                  "concept_ids",
                  "difficulty"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/api/v1/me/attempts": {
      "get": {
        "operationId": "listMyAttempts",
        "summary": "List owned attempts, newest first",
        "responses": {
          "200": {
            "description": "List owned attempts, newest first",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AttemptResultPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "OPERATING_SYSTEM",
                "NETWORK",
                "DATABASE",
                "DATA_STRUCTURE",
                "ALGORITHM",
                "COMPUTER_ARCHITECTURE"
              ]
            }
          },
          {
            "name": "correct",
            "in": "query",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "origin",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "CURATED",
                "AI_GENERATED"
              ]
            }
          }
        ],
        "description": "Owned immutable result snapshots, newest submitted_at then UUID descending. Cursor is bound to user and filters."
      }
    },
    "/api/v1/me/attempts/{attempt_id}": {
      "get": {
        "operationId": "getMyAttempt",
        "summary": "Get owned historical quiz version and result, including retired quizzes",
        "responses": {
          "200": {
            "description": "Get owned historical quiz version and result, including retired quizzes",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AttemptResult"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "parameters": [
          {
            "name": "attempt_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/api/v1/me/wrong-answers": {
      "get": {
        "operationId": "listMyWrongAnswers",
        "summary": "List review states for quizzes ever answered incorrectly",
        "responses": {
          "200": {
            "description": "List review states for quizzes ever answered incorrectly",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewItemPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "description": "One state per owned quiz version ever answered incorrectly; last_wrong_at DESC,quiz_id DESC cursor bound to filters. Actual server grading alone resolves or reopens review. Retries use existing quiz attempts API with retry_of_attempt_id.",
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "NEEDS_REVIEW",
                "RESOLVED"
              ]
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "OPERATING_SYSTEM",
                "NETWORK",
                "DATABASE",
                "DATA_STRUCTURE",
                "ALGORITHM",
                "COMPUTER_ARCHITECTURE"
              ]
            }
          },
          {
            "name": "origin",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "CURATED",
                "AI_GENERATED"
              ]
            }
          }
        ]
      }
    },
    "/api/v1/me/stats": {
      "get": {
        "operationId": "getMyStats",
        "summary": "Statistics include retries; accuracy is null when there are no attempts",
        "responses": {
          "200": {
            "description": "Statistics include retries; accuracy is null when there are no attempts",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Stats"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/health": {
      "get": {
        "operationId": "health",
        "summary": "Database readiness; no credentials or component details",
        "security": [],
