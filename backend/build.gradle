plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.csas'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking { lockAllConfigurations() }
checkstyle { toolVersion = '10.26.1' }
spotless { java { googleJavaFormat('1.28.0') } }
tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '512m'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'short' }
}
tasks.named('bootJar') { archiveFileName = 'csas-backend.jar' }
tasks.named('wrapper') { gradleVersion = '8.14.3'; distributionType = Wrapper.DistributionType.BIN }
