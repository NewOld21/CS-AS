name: Harness checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify documentation and harness
        run: python3 scripts/verify.py
# 서비스 구현 후 full 검사를 별도 job에 등록한다. 현재 green은 앱 완료를 의미하지 않는다.
